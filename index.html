<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>語文常識闖關站｜書信與題辭</title>

<body>
<div class="wrap" id="app"></div>

<script>
/* =========================================================
   語文常識闖關站：可擴充的單元架構
   新增主題時：在 MODULES 加一個模組，裡面放 stages（learn / mix / exam）。
   ========================================================= */

// ---------- 小工具 ----------
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];} return a; };
const uniq = a => [...new Set(a)];
const LT = ['A','B','C','D','E','F'];
function sampleDistinct(pool, n, exclude=[]){ return shuffle(uniq(pool).filter(x=>!exclude.includes(x))).slice(0,n); }
function mc(q, correct, distractors, exp, extra={}){
  const opts = shuffle([correct, ...distractors.slice(0,3)]);
  return Object.assign({q, opts, ans:[opts.indexOf(correct)], exp}, extra);
}
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

// ---------- 題型產生器 ----------
// 分類題：items = [[詞, '可接受的標籤(可多個)'], ...]
function genClassify(items, labels, promptFn, expFn){
  return () => {
    const arr = typeof items==='function' ? items() : items;
    if(!arr.length) return null;
    const it = pick(arr); const keys = Object.keys(labels);
    const opts = keys.map(k=>labels[k]);
    const ans = keys.map((k,i)=> it[1].includes(k)?i:-1).filter(i=>i>=0);
    const exp = expFn ? expFn(it) : `「${it[0]}」→ ${ans.map(i=>opts[i]).join(' 或 ')}`;
    return {q: promptFn(it[0]), opts, ans, exp, cols:true, key:'c'+it[0]};
  };
}
// 配對題：pairs = [[詞(可用、分隔同義), 說明]]，雙向出題
function genPairs(pairs, toMeaning, toTerm){
  return () => {
    if(pairs.length<4) return null;
    const p = pick(pairs); const terms = p[0].split('、'); const term = pick(terms);
    const others = pairs.filter(x=>x!==p && x[1]!==p[1]);
    if (toTerm && (!toMeaning || Math.random()<.5)){
      const ds = shuffle(others).slice(0,3).map(x=>pick(x[0].split('、')));
      return mc(toTerm(p[1]), term, ds, `「${p[1]}」→「${p[0]}」`, {key:'p'+p[1]});
    }
    const ds = shuffle(others).slice(0,3).map(x=>x[1]);
    return mc(toMeaning(term), p[1], ds, `「${p[0]}」：${p[1]}`, {key:'p'+term});
  };
}
function genFixed(list){
  return () => { if(!list.length) return null; const f = pick(list); return mc(f[0], f[1], f[2], f[3]||'', {key:'f'+f[0]}); };
}

// =========================================================
//                      資料：書信
// =========================================================
const OBJ5 = {A:'直系長輩', B:'旁系長輩', C:'師長', D:'平輩', E:'晚輩'};
const OBJ5_NOTE = '直系長輩＝祖父母、父母；旁系長輩＝伯叔、舅姨、姑等其他長輩';
const OBJ3 = {A:'長輩', B:'平輩', C:'晚輩'};

const PARTS = ['稱謂','提稱語','啟事敬詞','開頭應酬語','正文','結尾應酬語','申悃語','問候語','自稱','署名','末啟詞','日期'];
const PART_DEF = [
  ['稱謂','對收信人的稱呼，寫在信的第一行並頂格'],
  ['提稱語','請對方讀信的意思，現代書信常以冒號代替'],
  ['啟事敬詞','發語詞，表示要開始述說事情，如「敬稟者」'],
  ['開頭應酬語','說正事前的客套話：表思念、感謝或頌揚對方'],
  ['正文','信中談論主要事情的文字'],
  ['結尾應酬語','正文結束時，為避免突然收結而說的客氣話'],
  ['申悃語','說明自己的話出於誠意，如「謹此奉稟」「專此」'],
  ['問候語','又稱祝福語，問候對方安好，如「敬請　大安」'],
  ['自稱','寫信人對自己的稱呼，字略小偏右以示謙卑'],
  ['署名','寫信人的名字；對近親只寫名'],
  ['末啟詞','表示把信中的事恭敬告訴對方，如「叩上」「敬啟」'],
  ['日期','完成這封信的日期']
];
const OMITTED = ['提稱語','啟事敬詞','開頭應酬語','結尾應酬語','申悃語'];
const KEPT = ['稱謂','正文','問候語','自稱','署名','末啟詞','日期'];

// 範例書信（分段標記）
const LETTERS = [

function renderLetter(L, hlPart, labels){

  }).join('') + '</div>';
}

  src:'捷綸兄足下：日前至〔貴〕府歡聚，承蒙〔賢〕伉儷熱情款待及〔令〕郎驅車接送，深情厚誼，我與〔小〕兒銘感五內。欣逢中秋佳節，〔家〕母與〔舍〕弟均來家中團聚，〔愚〕夫婦擬在〔寒〕舍敬備菲酌，恭請您及〔尊〕夫人大駕光臨。',
  pool:['家','舍','小','愚','令','尊','賢','貴','寒']
};
function genFill(){
  const parts = FILL_TEXT.src.split(/〔|〕/); // even=text, odd=answer
  const idxs = parts.map((_,i)=>i).filter(i=>i%2===1); const t = pick(idxs); const ans = parts[t];
  const html = parts.map((s,i)=> i%2===0 ? s : (i===t ? '<span class="seg hl">（　）</span>' : `<u>${s}</u>`)).join('');
  const rule = {'貴':'敬稱對方的家：貴府','賢':'敬稱對方夫妻：賢伉儷','令':'敬稱對方的兒子：令郎','小':'謙稱自己的兒子：小兒','家':'稱自己的長輩：家母','舍':'稱自己的弟妹：舍弟','愚':'謙稱自己夫妻：愚夫婦','寒':'謙稱自己的家：寒舍','尊':'敬稱對方的妻子：尊夫人'}[ans];
  return mc(`依書信稱謂，括號中應填入哪個字？<div class="letter" style="font-size:16px">${html}</div>`, ans, sampleDistinct(FILL_TEXT.pool,3,[ans]), rule, {cols:true, key:'fill'+t});
}

<h3>柬帖是什麼？</h3><p>婚喪喜慶、交際應酬用的簡短文書。古時刻在竹片上叫「柬」，寫在絹帛上叫「帖」。</p>

<h3>範例：結婚柬帖</h3>
<div class="invite">謹<b class="k">詹</b>於中華民國一一四年國曆六月十四日（星期六）農曆五月十九日<br>為　長男俊賢　次女怡雯　舉行結婚典禮敬備喜筵　恭請<br><b class="k">闔第光臨</b><div style="text-align:right">王順吉　李　華<br>孫一宏　林美秀　鞠躬</div><b class="k">恕邀</b>　席設：臺中市東區明光路一段十號雅舍大飯店<br>　　　時間：下午六時入席</div>
<h3>範例：慶壽柬帖</h3>
<div class="invite">謹訂於中華民國一一四年國曆四月二十日（星期日）農曆三月廿三日為<br>家嚴七十大壽敬備<b class="k">桃樽</b>　恭請<br>光臨<div style="text-align:right">林宣如　林美華　謹訂</div>時間：中午十二時<br>席設：臺東縣太麻里鄉千禧街一號天天來餐館</div>
${tableHTML(['用語','意思'],[['詹','選定（日子）'],['恕邀','本應登門邀請，因人多不便改寄柬帖，請求原諒'],['桃樽、桃觴','祝壽的酒席（桃＝生日；樽、觴＝酒器）'],['闔第光臨','請全家一起來'],['秩','十年：八秩＝八十歲，九秩晉二＝九十二歲'],['壽誕／聖誕','一般人生日用「壽誕」；「聖誕」只用於聖人、神明']])}`;

// 通用：答案可能重複的「答案—線索」清單（如 人物—事蹟），雙向出題
function genGroup(itemsIn, clueQ, ansQ, expFn){
  return () => {
    const items = typeof itemsIn==='function' ? itemsIn() : itemsIn;
    if(items.length<4) return null;
    const it = pick(items);
    const others = uniq(items.map(x=>x[0])).filter(a=>a!==it[0]);
    if(others.length<3) return null;
    const exp = expFn ? expFn(it) : `「${it[1]}」→ ${it[0]}`;
    if(ansQ && (!clueQ || Math.random()<.4)){
      const ds = sampleDistinct(items.filter(x=>x[0]!==it[0]).map(x=>x[1]),3);
      if(ds.length<3) return null;
      return mc(ansQ(it[0]), it[1], ds, exp, {key:'ga'+it[0]+it[1]});
    }
    return mc(clueQ(it[1]), it[0], sampleDistinct(others,3), exp, {key:'gc'+it[1]});
  };
}

function lastChar(s){ const m = s.replace(/[，。、；\s]/g,''); return m.slice(-1); }
function toneNote(s, upper){
  const c = lastChar(s);
  if(upper) return `上聯末字「${c}」是仄聲${RUSHENG.includes(c)?'（古入聲字，屬仄聲）':'（國語三、四聲）'}`;
  return `下聯末字「${c}」是平聲（國語一、二聲）`;
}
function genCoupletSide(){
  if(!COUPLETS.length) return null;
  const c = pick(COUPLETS); const up = Math.random()<.5; const line = up?c[0]:c[1];
  return {q:`依據「仄起平收」的原則，<span class="big">${line}</span><br>應該是上聯還是下聯？`, opts:['上聯（面對大門貼右邊）','下聯（面對大門貼左邊）'], ans:[up?0:1],
    exp:`${toneNote(line, up)}。完整對聯：上聯「${c[0]}」／下聯「${c[1]}」`, cols:true, key:'cs'+line};
}
function genCoupletMatch(){
  if(COUPLETS.length<4) return null;
  const c = pick(COUPLETS); const n = c[0].length;
  let pool = COUPLETS.filter(x=>x!==c && x[1].length===n).map(x=>x[1]);
  if(pool.length<3) pool = COUPLETS.filter(x=>x!==c).map(x=>x[1]);
  return mc(`上聯是「<b>${c[0]}</b>」，下列哪一句最適合當它的下聯？`, c[1], sampleDistinct(pool,3,[c[1]]),
    `字數相等、對仗工整，且${toneNote(c[1], false)}。（${c[2]}）`, {key:'cm'+c[0]});
}
function genCoupletReversed(){
  if(COUPLETS.length<4) return null;
  const four = shuffle(COUPLETS).slice(0,4); const k = rnd(4);
  const opts = four.map((c,i)=> i===k ? `${c[1]}／${c[0]}` : `${c[0]}／${c[1]}`);
  const c = four[k];
  return {q:'下列對聯皆以「上聯／下聯」的順序排列，哪一副的上下聯<b>顛倒</b>了？', opts, ans:[k],
    exp:`「${c[1]}」末字「${lastChar(c[1])}」是平聲，應為下聯；「${c[0]}」末字「${lastChar(c[0])}」是仄聲，應為上聯。`, key:'cr'+c[0]};
}
function genCoupletCat(scope){
  return () => {
    const pool = COUPLETS.filter(c=>scope.includes(c[2])); if(pool.length<2) return null;
    const c = pick(pool);
    if(Math.random()<.55){
      const ds = sampleDistinct(scope.filter(x=>x!==c[2]),3);
      return mc(`對聯「<b>${c[0]}／${c[1]}</b>」最適合用於哪裡？`, c[2], ds, `「${c[0]}／${c[1]}」→ ${c[2]}`, {key:'cc'+c[0]});
    }
    const ds = shuffle(COUPLETS.filter(x=>x[2]!==c[2] && scope.includes(x[2]))).slice(0,3).map(x=>`${x[0]}／${x[1]}`);
    if(ds.length<3) return null;
    return mc(`要用在「<b>${c[2]}</b>」，下列哪一副對聯最恰當？`, `${c[0]}／${c[1]}`, ds, `「${c[0]}／${c[1]}」→ ${c[2]}`, {key:'cc'+c[0]});
  };
}

const COLOR_SET = ['紅','黃','綠','藍','白','黑'];
function genColorReal(){
  if(!COLORS.length) return null;
  const it = pick(COLORS); const real = !!it[1];
  return {q:`<span class="big">${it[0]}</span><br>詞中的顏色字，是「實指顏色」還是「虛指」（不是指顏色）？`, opts:['實指顏色','虛指（另有意思）'], ans:[real?0:1],
    exp:`「${it[0]}」：${it[2]}${real?`→ 實指「${it[1]}」色`:' → 不是指顏色'}`, cols:true, key:'cr'+it[0]};
}
function genColorWhich(){
  const pool = COLORS.filter(x=>x[1] && COLOR_SET.includes(x[1])); if(pool.length<2) return null;
  const it = pick(pool);
  return {q:`<span class="big">${it[0]}</span><br>詞中的顏色字是指什麼顏色？`, opts:COLOR_SET, ans:[COLOR_SET.indexOf(it[1])], exp:`「${it[0]}」：${it[2]}`, cols:true, key:'cw'+it[0]};
}
function genColorMeaning(){
  const pool = COLORS.filter(x=>!x[1]); if(pool.length<4) return null;
  const it = pick(pool);
  return mc(`「<b>${it[0]}</b>」的顏色字不是指顏色，整個詞的意思是？`, it[2], sampleDistinct(pool.filter(x=>x!==it).map(x=>x[2]),3,[it[2]]), `「${it[0]}」：${it[2]}`, {key:'cm'+it[0]});
}

  {q:'下列選項，何者與〈定風波〉所呈現的心境最接近？', opts:['揀盡寒枝不肯棲，寂寞沙洲冷','人生得意須盡歡，莫使金樽空對月','試問嶺南應不好，卻道，此心安處是吾鄉','人有悲歡離合，月有陰晴圓缺，此事古難全'], a:2, exp:'(C)逆境中隨遇而安的曠達襟懷。(A)孤芳自賞　(B)及時行樂　(D)人事無常。'},
  {q:'〈定風波〉中，哪一句表現「忘懷得失」的心境？', opts:['回首向來蕭瑟處，歸去，也無風雨也無晴','莫聽穿林打葉聲，何妨吟嘯且徐行','竹杖芒鞋輕勝馬，誰怕？','料峭春風吹酒醒，微冷'], a:0, exp:''},
  {q:'〈定風波〉依字數屬於？', opts:['中調','小令','長調','絕句'], a:0, exp:'共62字：小令58字以內、中調59～90字、長調91字以上。'}

 yy: [ // 與宋元思書

  {q:'從〈與宋元思書〉中可以看出哪些訊息？（多選）', opts:['呈現兩人共遊所看見的奇山異水','能夠窺見富春江兩岸的四季美景','可以得知吳均一生喜愛遊山玩水','內容是作者寫給宋元思的一封信','文中記述富春江沿途的山光水色'], a:[3,4], exp:'(A)不是兩人共遊　(B)寫的是沿岸奇山異水，不是四季　(C)文本未提及。'},
  {q:'小青整理駢文、散文的差異，她只寫對了哪一項？', opts:['字句：駢文以四、六字句為多；散文以五、七言為主','對偶：駢文常用對偶，格式整齊；散文不要求對偶','音韻：駢文不可換韻，一韻到底；散文注重音韻，聲調和諧','別稱：駢文稱四六文；散文稱韻文'], a:1, exp:'(A)散文字數不拘　(C)駢文不要求押韻；散文不用韻　(D)散文不是韻文。'},
  {q:'朱峻打算題字贈送友人，鼓勵他滌盡俗慮、忘卻官場紛擾、樂享逍遙寫意的生活。下列何者<b>最不適合</b>？', opts:['採菊東籬下，悠然見南山','久在樊籠裡，復得返自然','虛心竹有低頭葉，傲骨梅無仰面花','鳶飛戾天者，望峰息心；經綸世務者，窺谷忘返'], a:2, exp:'(C)勉人要虛心、有志節，與忘卻官場無關。樊籠：鳥籠，比喻束縛。'},

 sy: [ // 一家手語餐廳的誕生

  {q:'哪個<b>不是</b>多倫多手語餐廳受到歡迎的原因？', opts:['世界重要媒體競相加以報導','店家常常推出優惠吸引顧客','到處有手語教學圖示很新鮮','人們喜歡感受新的生活體驗'], a:1, exp:'(B)文中未述及。'},
  {q:'多倫多手語餐廳開業後，最令老闆感到欣慰的是什麼？', opts:['別開風氣，一炮而紅','廣受歡迎，門庭若市','初衷得報，善念得償','聽障者安，視障者喜'], a:2, exp:'第6段：如願以償、一償宿願。'},
  {q:'作者引用海倫．凱勒「如果每一個人在其成年的早期，有幾天時間能成為瞎子與聾子，應不失為一件幸事」的名言，其用意<b>不包含</b>下列何者？', opts:['認為有視力和聽力並不是理所當然','強調人往往在失去之後才懂得珍惜','期盼人們能夠設身處地，將心比心','凸顯瞎子與聾子感官能力勝於常人'], a:3, exp:'希望人們惜福，不要等到失去才知道擁有時的幸福。'},
  {q:'關於〈一家手語餐廳的誕生〉的寫作手法，下列何者正確？（多選）', opts:['全文融敘事、寫景、抒懷於一體','引用事例、善用名言，來表達觀點','以自身造訪餐廳的經驗，抒發感懷','藉國外經驗喚起國人對身障者議題的省思'], a:[1,3], exp:'作者多次呼籲人們了解身障社會的文化、重視身障者人權，而非寫景抒懷或自身經驗。'},

  {q:'作者在篇首與結尾都引用馬克．吐溫「仁慈是一種聾子能聽見、盲人能看見的語言」，有什麼效果？', opts:['首尾呼應，強調文章主旨','製造懸疑，吸引讀者','對比古今，凸顯差異','增加篇幅，充實內容'], a:0, exp:''},
  {q:'「在黑暗中」餐廳和手語餐廳的相似之處是？', opts:['都聘用身障人士為主要員工，讓顧客體驗身障者的處境','都只開在加拿大','都提供免費餐點','都禁止顧客說話'], a:0, exp:''}

  {q:'關於〈有關氣候變遷的難題〉中潔淨能源與科技的敘述，下列何者正確？', opts:['人們對於如何選擇潔淨能源方式已具有高度的共識','潔淨科技的創新必定能有效降低人們的能源使用量','只要長期對潔淨科技投入資源，即可降低失敗風險','潔淨科技的創新會產生許多原本不存在的應用方式'], a:3,

  {q:'作者認為減緩氣候變遷的兩個途徑是？', opts:['減少碳排放、增加能源使用效率','多種樹、少吃肉','發展核電、廢除風電','提高油價、禁止開車'], a:0, exp:''},

  {q:'（課外閱讀）庾公乘馬有的盧，或語令賣去，庾云：「賣之必有買者，即當害其主，寧可不安己而移於他人哉？」下列何者最能說明庾公的人格特質？', opts:['八面玲瓏，面面俱到','安分守己，逆來順受','人而無信，不知其可','己所不欲，勿施於人'], a:3, exp:'同理心、推己及人。的盧：不祥之馬。'}

function genIdiomSentence(keys){
  return () => {
    const items = keys.flatMap(k=>IDS[k].s.map(s=>[s[0], s[1], k])); if(!items.length) return null;
    const it = pick(items); const pool = uniq(IDS[it[2]].m.map(x=>x[0])).filter(x=>x!==it[1]);
    if(pool.length<3) return null;
    return mc(`請選出最適合填入（　）的成語：<div class="letter" style="font-size:17px">${it[0]}</div>`, it[1], sampleDistinct(pool,3), `${it[1]}：${(IDS[it[2]].m.find(x=>x[0]===it[1])||[,''])[1]}`, {key:'is'+it[0]});
  };
}
function genIdiomMeaning(keys){

}
function genObjQ(listFn){

}

function syncMine(){
  if(!CONFIG.GAS_URL || !student) return;
  const me = sid(); SYNC = {state:'loading', n:0};
  fetch(CONFIG.GAS_URL + `?action=mine&cls=${encodeURIComponent(student.cls)}&seat=${encodeURIComponent(student.seat)}`)
    .then(r=>r.text()).then(t=>{
      const d = JSON.parse(t); if(sid()!==me) return;
      if(!d.rows){ SYNC = {state:'old', n:0}; if(document.getElementById('swap')) home(); return; }
      SYNC = {state:'ok', n:d.rows.length};
      const srv = {};
      d.rows.forEach(r=>{
        if(r.mode==='錯題再練' || !r.stage) return;
        const id = String(r.stage), total = +r.total||0, correct = +r.correct||0, secs = +r.secs||0;
        const lim = (+r.lim || (/^e\d/.test(id) ? CONFIG.EXAM_LIMIT_MIN : CONFIG.LIMIT_MIN)) * 60;
        const ok = total>0 && correct===total && secs<=lim && (+r.leaves||0)<=CONFIG.LEAVE_ALLOW;
        const x = srv[id] = srv[id] || {tries:0, best:0, n:total, passed:false};
        x.tries++; x.best = Math.max(x.best, correct); x.n = total;
        if(ok && (!x.passed || secs < x.passSecs)){ x.passed = true; x.passSecs = secs; }
        if(U[id]) readDone[id] = 1;
      });
      Object.entries(srv).forEach(([id,x])=>{
        const p = progress[id] || {tries:0, best:0, n:x.n, passed:false};
        p.tries = Math.max(p.tries, x.tries); p.best = Math.max(p.best, x.best); p.n = x.n || p.n;
        if(x.passed && (!p.passed || x.passSecs < (p.passSecs||1e9))){ p.passed = true; p.passSecs = x.passSecs; }
        progress[id] = p;
      });
      saveProg();
      if(document.getElementById('swap')) home();   // 正在看地圖時，馬上更新畫面
    }).catch(()=>{ SYNC = {state:'fail', n:0}; if(document.getElementById('swap')) home(); });

function buildRound(cfg, n){
  const qs=[]; const seen=new Set(); let guard=0;
  const byUnit = {}; cfg.gens.forEach(x=>{ (byUnit[x.u]=byUnit[x.u]||[]).push(x.g); });
  const units = Object.keys(byUnit); let order = shuffle(units);
  while(qs.length<n && guard<800){ guard++;
    if(qs.length % units.length===0) order = shuffle(units);
    const uu = order[qs.length % units.length];
    const q = pick(byUnit[uu])(); if(!q) continue;
    const k = q.key || q.q; if(seen.has(k)) continue; seen.add(k); q.unit=uu; qs.push(q);
  }
  return shuffle(qs);
}
function startQuiz(cfg){ runQuiz(Object.assign({}, cfg, {fixed: buildRound(cfg, CONFIG.ROUND_N)})); }

    <div class="fb" id="fb"></div>
    <div class="toolbar" style="justify-content:flex-end"><button class="btn red hidden" id="nx">${i+1<qs.length?'下一題 →':'看結果'}</button></div></div>`;
    window.scrollTo(0,0);
    document.getElementById('bk').onclick = ()=>{ clearInterval(timerId); stopGuard(); exitFull(); home(); };
    updLeave();
    const tm = document.getElementById('tm');
    const tick=()=>{ const s=Math.floor((Date.now()-t0)/1000);
      if(cfg.redo){ tm.textContent=`⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; return; }
      const left = limitSec - s;
      if(left>=0){ tm.textContent=`⏳ 剩下 ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`; tm.className = 'timer'+(left<=60?' late':''); }
      else if(cfg.contest){ tm.textContent='⏰ 時間到！'; tm.className='timer over'; finish(); }
      else { tm.textContent=`⏰ 已超過 ${limitMin} 分鐘，這回不算過關（仍可繼續作答看詳解）`; tm.className='timer over'; } };
    tick(); timerId=setInterval(tick,1000);
    if(q.type==='order'){
      let seq = [];
      const ansBox = document.getElementById('ordans'), okBtn = document.getElementById('ordok');
      const draw = ()=>{ ansBox.innerHTML = seq.length ? seq.map((k,n)=>`<span class="chip2 on">${n+1}. ${q.pieces[k]}</span>`).join('') : '<span class="sub">依序點選下方句子 ↓</span>';
        app.querySelectorAll('#ordpool .chip2').forEach(b=>{ b.disabled = seq.includes(+b.dataset.k); }); okBtn.disabled = seq.length!==q.pieces.length; };
      app.querySelectorAll('#ordpool .chip2').forEach(b=>b.onclick=()=>{ seq.push(+b.dataset.k); draw(); });
      document.getElementById('ordreset').onclick = ()=>{ seq=[]; draw(); };
      okBtn.onclick = ()=>{ const ok = seq.every((k,n)=>k===n);
        app.querySelectorAll('.chip2, #ordreset, #ordok').forEach(b=>b.disabled=true);
        ansBox.querySelectorAll('.chip2').forEach((c,n)=>c.classList.add(seq[n]===n?'right':'wrong'));
        grade(ok); };
    } else if(q.multi){
      const sel = new Set(); const okBtn = document.getElementById('multiok');
      app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; if(sel.has(k)){ sel.delete(k); b.classList.remove('picked'); } else { sel.add(k); b.classList.add('picked'); } okBtn.disabled = !sel.size; });
      okBtn.onclick = ()=>{ const ok = sel.size===q.ans.length && q.ans.every(a=>sel.has(a));
        okBtn.disabled = true;
        app.querySelectorAll('.opt').forEach((b,j)=>{ b.disabled=true; b.classList.remove('picked'); if(q.ans.includes(j)) b.classList.add('right'); else if(sel.has(j)) b.classList.add('wrong'); });
        grade(ok); };
    } else {
      app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    }
  }
  function ansTextOf(q){ return q.ansText || q.ans.map(a=>`(${LT[a]}) ${q.opts[a]}`).join('、'); }
  function answer(k){
    const q = qs[i]; const ok = q.ans.includes(k);
    app.querySelectorAll('.opt').forEach((b,j)=>{ b.disabled=true; if(q.ans.includes(j)) b.classList.add('right'); else if(j===k) b.classList.add('wrong'); });
    grade(ok);
  }
  function grade(ok){
    const q = qs[i];
    const fb = document.getElementById('fb');
    fb.className = 'fb '+(ok?'ok':'no');
    fb.innerHTML = (ok?'<b>✔ 答對了！</b> ':'<b>✘ 再想想：</b>正確答案是「'+(q.type==='order'||q.multi ? ansTextOf(q) : q.ans.map(a=>q.opts[a]).join('」或「'))+'」。<br>') + (q.exp||'');
    if(ok) score++; else wrong.push(q);
    answeredN++;
    if(cfg.contest){
      cfg._wrongIdx = cfg._wrongIdx || []; if(!ok) cfg._wrongIdx.push(i);
      ctReport(cfg, answeredN, score, Math.round((Date.now()-t0)/1000), leaves, false);
      fb.innerHTML = ok ? '<b>✔ 答對了！往上爬一步 🧗</b>' : '<b>✘ 答錯了，原地喘口氣…</b>（比賽結束後可以看詳解）';
      setTimeout(()=>{ if(finished) return; i++; if(i<qs.length) render(); else finish(); }, 900);
      return;
    }
    const nx = document.getElementById('nx'); nx.classList.remove('hidden'); nx.focus();
    nx.onclick = ()=>{ i++; if(i<qs.length) render(); else finish(); };
  }
  function finish(){
    if(finished) return; finished = true;
    clearInterval(timerId); stopGuard(); exitFull();
    const lw = document.getElementById('leavewarn'); if(lw) lw.remove();
    const secs = Math.max(1, Math.round((Date.now()-t0)/1000));
    const avg = Math.round(secs/qs.length*10)/10;
    const allCorrect = score===qs.length;
    const timeOK = secs <= limitSec;
    const official = !cfg.redo;               // 錯題再練不列入過關
    const leaveOK = leaves <= CONFIG.LEAVE_ALLOW;
    const passed = official && allCorrect && timeOK && leaveOK;
    if (official){
      const p = progress[cfg.id] || {tries:0, best:0, n:qs.length, passed:false};
      p.tries++; p.n=qs.length; p.best=Math.max(p.best, score);
      if(passed && !p.passed){ p.passed=true; p.passSecs=secs; p.passAt=new Date().toISOString(); }
      progress[cfg.id]=p; saveProg();
    }
    sendRecord({cls:student.cls, seat:student.seat, name:student.name, stage:cfg.id, stageName:cfg.title, mode: cfg.redo?'錯題再練':(cfg.contest?'競賽':'正式'),
      total:qs.length, correct:score, allCorrect, secs, avg, passed, minAvg:limitMin, limitMin, leaves, awaySecs});
    if(cfg.contest){ ctReport(cfg, answeredN, score, secs, leaves, true); return ctResult(cfg, score, qs.length, secs); }
    const nxt = cfg.stage ? nextStage(cfg.stage) : null;
    let msg;
    if (passed) msg = '<b class="ok-t">🎉 全對過關！</b>可以往下一關前進。';
    else if (!official) msg = allCorrect ? '錯題都會了！回到正式練習，全對才算過關。' : '還有不熟的，再看一次詳解吧。';
    else if (allCorrect && timeOK && !leaveOK) msg = `<b class="k">全對，但作答中離開頁面 ${leaves} 次，這一回不算過關。</b><br>請留在作答頁面、不查資料，再挑戰一次！`;
    else if (!leaveOK) msg = `答對 ${score} 題，而且作答中離開頁面 ${leaves} 次。<b>要全對、在時間內、不離開頁面才算過關</b>，再挑戰一次！`;
    else if (allCorrect && !timeOK) msg = `<b class="k">全對，但超過 ${limitMin} 分鐘了！</b><br>把重點記熟、不看講義，在時間內完成才算過關，再挑戰一次吧！`;
    else if (!timeOK) msg = `答對 ${score} 題，而且超過 ${limitMin} 分鐘。<b>要全對、在時間內完成才算過關</b>，先把錯題弄懂再挑戰！`;
    else msg = `答對 ${score} 題，<b>要全對才算過關</b>。先把錯題弄懂，再挑戰一回新題目！`;
    app.innerHTML = `<button class="back" id="bk">← 回闖關地圖</button><h2>${cfg.title}</h2>
    <div class="card result"><div class="score">${score} / ${qs.length}</div>
    <div class="bigpass ${passed?'ok':''}">${passed?'✔ 過關':'尚未過關'}</div>
    <p>${msg}<br><span class="sub">用時 ${fmtSec(secs)}（限時 ${limitMin} 分鐘）${leaves?`・離開頁面 ${leaves} 次（共 ${awaySecs} 秒）`:''}</span></p>
    <div class="toolbar" style="justify-content:center">
      ${wrong.length?'<button class="btn" id="redo">錯題再練一次（不計過關）</button>':''}
      <button class="btn red" id="again">${cfg.examFixed?'再挑戰一次':'再挑戰一回（新題目）'}</button>
      ${cfg.readUid?'<button class="btn ghost" id="reread">回去讀重點</button>':''}
      ${nxt && passed?'<button class="btn ghost" id="next">下一關 →</button>':''}
    </div>
    ${wrong.length?`<div class="wronglist"><h3>錯題整理</h3><ol>${wrong.map(q=>`<li>${stripBig(q.q)}<br><b class="k">答案：${q.ansText || q.ans.map(a=>q.opts[a]).join('／')}</b><br><span class="sub">${q.exp||''}</span></li>`).join('')}</ol></div>`:''}
    </div>`;
    window.scrollTo(0,0);
    document.getElementById('bk').onclick = home;
    const redo = document.getElementById('redo'); if(redo) redo.onclick = ()=>runQuiz(Object.assign({},cfg,{fixed:shuffle(wrong).map(q=>reshuffle(q)), title:cfg.title+'・錯題再練', redo:true}));
    const base = Object.assign({}, cfg, {redo:false, title: cfg.title.replace('・錯題再練','')});
    document.getElementById('again').onclick = ()=> base.gens ? startQuiz(base) : runQuiz(Object.assign(base,{fixed:base.examFixed?EXAM.filter(e=>base.stage.id+e.grp===base.id).map(examQ):base.fixed}));
    const rr = document.getElementById('reread'); if(rr) rr.onclick = ()=>learn(cfg.readUid);
    const nb = document.getElementById('next'); if(nb) nb.onclick = ()=>{ if(nxt.type==='learn') learn(nxt.u); else if(nxt.type==='mix') startMix(nxt.id); else startExam(nxt); };
  }
  render();
}
function limitFor(cfg){ if(cfg.contest) return cfg.contest.mins; return (cfg.examFixed || /^e\d/.test(cfg.id)) ? CONFIG.EXAM_LIMIT_MIN : CONFIG.LIMIT_MIN; }
function examQ(e){ const m = Array.isArray(e.a); return {q:e.q, opts:e.opts, ans:m?e.a:[e.a], multi:m, exp:e.exp, tag:e.tag}; }
function reshuffle(q){ if(q.type==='order' || q.multi || q.keepOrder || q.cols || q.opts.some(o=>/^\(/.test(o))) return q; const order = shuffle(q.opts.map((_,i)=>i)); return Object.assign({}, q, {opts:order.map(i=>q.opts[i]), ans:q.ans.map(a=>order.indexOf(a))}); }
function stripBig(html){ return html.replace(/<div class="(letter|note|invite|post|grid2|envs)[\s\S]*$/,'（見原題）').replace(/<br>/g,' '); }

function loadTeacher(){

    if(d.error){ msg.textContent = '⚠ '+d.error; return; }

    lastRows = d.rows; renderTeacher(d.rows);
  }).catch(e=>{ msg.textContent = '⚠ 讀取失敗：'+e; });

function renderTeacher(rows){
  const fcls = document.getElementById('fcls').value.trim();
  const lim = id => (/^e\d/.test(id) ? CONFIG.EXAM_LIMIT_MIN : CONFIG.LIMIT_MIN) * 60;
  const cols = teacherColumns();
  const S = {};
  rows.filter(r=>r.mode!=='錯題再練').forEach(r=>{
    const key = r.cls+'-'+r.seat; if(fcls && String(r.cls)!==fcls) return;
    const s = S[key] = S[key] || {cls:r.cls, seat:+r.seat, name:r.name, st:{}};
    s.name = r.name;
    const c = s.st[r.stage] = s.st[r.stage] || {tries:0, best:0, pass:null, fastAll:0, n:r.total, leaves:0};
    const lv = +r.leaves || 0; c.leaves += lv; s.leaves = (s.leaves||0) + lv;
    c.tries++; c.best = Math.max(c.best, +r.correct); c.n = r.total;
    const allC = +r.correct === +r.total;
    if(allC && +r.secs > lim(r.stage)) c.fastAll++;
    if(allC && +r.secs <= lim(r.stage) && lv <= CONFIG.LEAVE_ALLOW && !c.pass) c.pass = {secs:+r.secs, avg:+r.avg, tries:c.tries, t:r.t};
  });
  const list = Object.values(S).sort((a,b)=> String(a.cls).localeCompare(String(b.cls)) || a.seat-b.seat);
  if(!list.length){ document.getElementById('tout').innerHTML='<div class="card">目前沒有紀錄。</div>'; return; }
  let h = `<div class="card legend2"><b>圖例：</b><span class="cell ok">✔ 2:15</span> 全對過關（括號內第幾回才過）
  <span class="cell bad">8/10 ×3</span> 尚未過關（最佳成績・練了幾回）
  <span class="cell fast">⏰</span> 曾經全對但超時（不算過關，可能邊看講義邊作答）
  <span class="cell fast">🚪3</span> 作答中離開頁面的總次數（可能去查答案或玩別的）・滑鼠停在格子上可看詳情</div>
  <div class="tscroll"><table class="tt"><tr><th>班級</th><th>座號</th><th>姓名</th><th>過關數</th><th title="作答中離開頁面的總次數">離開</th>${cols.map(c=>`<th title="${c.name}">${c.short}</th>`).join('')}</tr>`;
  list.forEach(s=>{
    const passN = cols.filter(c=>s.st[c.id]&&s.st[c.id].pass).length;
    h += `<tr><td>${s.cls}</td><td>${s.seat}</td><td>${s.name}</td><td><b>${passN}</b>/${cols.length}</td><td class="${s.leaves?'cell fast':''}">${s.leaves?'🚪'+s.leaves:''}</td>`;
    cols.forEach(c=>{
      const x = s.st[c.id];
      if(!x){ h+='<td class="cell"></td>'; return; }
      const fast = (x.fastAll ? '⏰' : '') + (x.leaves ? `<small>🚪${x.leaves}</small>` : '');
      if(x.pass) h += `<td class="cell ok" title="${c.name}｜第 ${x.pass.tries} 回過關｜用時 ${fmtSec(x.pass.secs)}｜共練 ${x.tries} 回${x.fastAll?'｜另有 '+x.fastAll+' 次全對但超時':''}${x.leaves?'｜離開頁面 '+x.leaves+' 次':''}">✔ ${Math.floor(x.pass.secs/60)}:${String(x.pass.secs%60).padStart(2,'0')}${x.pass.tries>1?`<small>(${x.pass.tries})</small>`:''}${fast}</td>`;
      else h += `<td class="cell ${x.fastAll?'fast':'bad'}" title="${c.name}｜最佳 ${x.best}/${x.n}｜共練 ${x.tries} 回${x.fastAll?'｜'+x.fastAll+' 次全對但超時':''}${x.leaves?'｜離開頁面 '+x.leaves+' 次':''}">${x.best}/${x.n} ×${x.tries}${fast}</td>`;
    });
    h += '</tr>';
  });
  h += `</table></div><div class="card sub">欄位代號：${cols.map(c=>`<b>${c.short}</b>＝${c.name}`).join('；')}<br>完整逐筆紀錄（含時間戳記、錯題再練）在 Google 試算表「紀錄」工作表，可直接篩選、排序或下載。</div>`;
  document.getElementById('tout').innerHTML = h;
}

function ctGet(extra=''){
  return fetch(CONFIG.GAS_URL + '?action=' + extra).then(r=>r.text()).then(t=>{ const d = JSON.parse(t); if(d.now) CT.offset = d.now - Date.now(); return d; });
}
function ctPost(obj){
  if(!CONFIG.GAS_URL) return;
  fetch(CONFIG.GAS_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({type:'contest'}, obj))}).catch(()=>{});
}
function ctStop(){ if(CT.poll){ clearInterval(CT.poll); CT.poll=null; } }
function ctNow(){ return Date.now() + CT.offset; }
function ctQuestions(c){
  const st = examStage(c.mod);
  const parts = c.scope==='all' ? st.parts : [c.scope];
  return EXAM.filter(e=>parts.includes(e.grp)).map(examQ);
}
function ctScopeName(c){ return `${MODULES[c.mod].title}・${c.scope==='all'?(MODULES[c.mod].examName||'會考題')+'全部':EXAM_GRP[c.scope]}`; }
function ctRank(list){
  return [...list].sort((a,b)=> (b.correct-a.correct) || ((b.done?1:0)-(a.done?1:0)) || ((a.done&&b.done)?(a.secs-b.secs):(b.answered-a.answered)) || ((a.secs||0)-(b.secs||0)));
}
function ctPlayers(c, g){ return ctRank(Object.entries(c.players||{}).map(([k,p])=>Object.assign({key:k}, p)).filter(p=>p.group===g)); }
function groupFinished(c, g){ const ps = ctPlayers(c,g); return ps.length>0 && ps.every(p=>p.done); }

// ---------------- 學生端 ----------------
function contestEntry(){
  ctStop();
  if(!CONFIG.GAS_URL){ app.innerHTML = `<button class="back" id="bk">← 回闖關地圖</button><div class="card">尚未設定 GAS_URL，無法進行競賽。</div>`; document.getElementById('bk').onclick=home; return; }
  app.innerHTML = `<button class="back" id="bk">← 回闖關地圖</button><h2>🏔 課堂競賽</h2><div class="card" id="cbox">連線中…</div>`;
  document.getElementById('bk').onclick = ()=>{ ctStop(); home(); };
  ctGet('contest').then(d=>{
    const c = d.contest; const box = document.getElementById('cbox'); if(!box) return;
    if(!c || c.status==='ended'){ box.innerHTML = '目前沒有進行中的競賽，請等老師建立競賽後再按一次。<div class="toolbar"><button class="btn red" id="retry">重新整理</button></div>'; document.getElementById('retry').onclick=contestEntry; return; }
    if(c.cls && c.cls!==String(student.cls)){ box.innerHTML = `這場競賽是 <b>${c.cls} 班</b> 的，你是 ${student.cls} 班，不能加入喔。`; return; }
    const me = (c.players||{})[`${student.cls}-${student.seat}`];
    if(me && me.group){ return ctWait(c.code, me.group); }
    if(c.status==='running'){ box.innerHTML = '比賽已經開始了，下一場再加入吧！'; return; }
    box.innerHTML = `<p>競賽範圍：<b>${ctScopeName(c)}</b>（${ctQuestions(c).length} 題，限時 ${c.mins} 分鐘）</p>
      <p><b>請選擇你的組別：</b></p>
      <div class="grpbtns">${GROUPS.map(g=>`<button class="grpbtn" data-g="${g}" style="background:${GROUP_COLOR[g]}">${g} 組</button>`).join('')}</div>
      <p class="sub">選錯組別請告訴老師。</p>`;
    box.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
      const g = b.dataset.g;
      ctPost({code:c.code, join:true, group:g, cls:student.cls, seat:student.seat, name:student.name, answered:0, correct:0});
      ctWait(c.code, g);
    });
  }).catch(()=>{ const box=document.getElementById('cbox'); if(box) box.textContent='連線失敗，請稍後再試。'; });
}
function ctWait(code, g){
  ctStop();
  app.innerHTML = `<button class="back" id="bk">← 離開競賽</button><h2>🏔 課堂競賽</h2>
    <div class="card waitbox"><div class="bigg" style="background:${GROUP_COLOR[g]}">${g}</div>
    <p>${student.name}，你在 <b>${g} 組</b>。</p><p class="sub" id="wmsg">等待老師按「開始比賽」…</p><div class="dots"><i></i><i></i><i></i></div></div>`;
  document.getElementById('bk').onclick = ()=>{ ctStop(); home(); };
  const check = ()=> ctGet('contest').then(d=>{
    const c = d.contest;
    if(!c || c.code!==code){ ctStop(); const m=document.getElementById('wmsg'); if(m) m.textContent='這場競賽已取消，請回地圖重新加入。'; return; }
    if(c.status==='running'){ ctStop(); ctStart(c, g); }
    else if(c.status==='ended'){ ctStop(); const m=document.getElementById('wmsg'); if(m) m.textContent='比賽已結束。'; }
  }).catch(()=>{});
  check(); CT.poll = setInterval(check, 2000);
}
function ctStart(c, g){
  const st = examStage(c.mod);
  const qs = ctQuestions(c);
  const elapsed = Math.max(0, (ctNow() - c.startAt)/1000);
  runQuiz({id: c.scope==='all' ? st.id+'all' : st.id+c.scope, title:`🏔 課堂競賽・${g} 組`, stage:st, fixed:qs, examFixed:true,
    contest:{code:c.code, group:g, mins:c.mins, late:elapsed}});
}
function ctReport(cfg, answered, correct, secs, leaves, done){
  ctPost({code:cfg.contest.code, group:cfg.contest.group, cls:student.cls, seat:student.seat, name:student.name, answered, correct, secs, leaves, done});
}
function ctResult(cfg, score, total, secs){
  const g = cfg.contest.group;
  app.innerHTML = `<h2>🏔 課堂競賽・${g} 組</h2>
    <div class="card result"><div class="score">${score} / ${total}</div><p class="sub">用時 ${fmtSec(secs)}</p>
    <div id="myrank" class="sub">等待同組同學完成…</div></div>
    <div class="card" id="grpboard"></div>
    <div class="card" id="rev"></div>`;
  const wrong = cfg.fixed.filter((q,i)=>cfg._wrongIdx && cfg._wrongIdx.includes(i));
  document.getElementById('rev').innerHTML = wrong.length ? `<h3 style="margin-top:0">錯題詳解</h3><ol class="wronglist">${wrong.map(q=>`<li>${stripBig(q.q)}<br><b class="k">答案：${q.ansText || q.ans.map(a=>q.opts[a]).join('／')}</b><br><span class="sub">${q.exp||''}</span></li>`).join('')}</ol>` : '<b class="ok-t">全部答對，太厲害了！</b>';
  const show = ()=> ctGet('contest').then(d=>{
    const c = d.contest; if(!c || c.code!==cfg.contest.code){ ctStop(); return; }
    const ps = ctPlayers(c, g); const myKey = `${student.cls}-${student.seat}`; const r = ps.findIndex(p=>p.key===myKey)+1;
    const over = c.status==='ended' || groupFinished(c,g);
    const mr = document.getElementById('myrank'); if(!mr){ ctStop(); return; }
    mr.innerHTML = over ? (r===1 ? '<div class="trophy">🏆</div><b class="ok-t" style="font-size:22px">恭喜！你是 '+g+' 組第一名！</b>' : `你是 ${g} 組第 <b>${r}</b> 名`) : `目前暫居 ${g} 組第 <b>${r}</b> 名，等待同組同學完成…`;
    document.getElementById('grpboard').innerHTML = `<h3 style="margin-top:0">${g} 組排行榜</h3>` + ctBoardList(ps, ctQuestions(c).length, myKey);
    if(over) ctStop();
  }).catch(()=>{});
  ctStop(); show(); CT.poll = setInterval(show, 4000);
  const bk = document.createElement('button'); bk.className='btn ghost'; bk.textContent='回闖關地圖'; bk.onclick=()=>{ ctStop(); home(); };
  app.appendChild(bk);
}
function ctBoardList(ps, total, myKey){
  if(!ps.length) return '<div class="sub">還沒有人加入</div>';
  return `<table class="lb">${ps.map((p,i)=>`<tr class="${p.key===myKey?'me':''}"><td class="rk">${p.done&&i<3?['🥇','🥈','🥉'][i]:i+1}</td><td class="nm">${p.name}</td>
    <td>${p.correct}/${total}</td><td class="sub">${p.done?'✔ '+fmtClock(p.secs):`作答中 ${p.answered}/${total}`}</td><td>${p.leaves?'🚪'+p.leaves:''}</td></tr>`).join('')}</table>`;
}
function fmtClock(s){ s=Math.round(s||0); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

// ---------------- 老師端：投影看板 ----------------
let CTT = { pin:'', c:null, mod:0 };
function contestTeacher(pin){
  ctStop(); CTT.pin = pin || CTT.pin;
  app.innerHTML = `<button class="back" id="bk">← 回老師端</button><h2>🏔 課堂競賽・建立</h2>
  <div class="card">
    <label>老師密碼 <input id="cpin" type="password" value="${CTT.pin}" style="width:140px"></label>
    <label style="margin-left:10px">冊別 <select id="cmod">${MODULES.map((m,i)=>`<option value="${i}" ${i===CTT.mod?'selected':''}>${m.title}</option>`).join('')}</select></label>
    <label style="margin-left:10px">範圍 <select id="cscope"></select></label>
    <label style="margin-left:10px">班級 <select id="ccls"><option value="">不限</option>${CONFIG.CLASSES.map(c=>`<option>${c}</option>`).join('')}</select></label>
    <label style="margin-left:10px">限時 <input id="cmins" type="number" value="10" min="1" style="width:56px"> 分鐘</label>
    <div class="toolbar"><button class="btn red" id="cnew">建立競賽</button><button class="btn ghost" id="copen">打開目前的競賽看板</button></div>
    <div id="cmsg" class="sub"></div>
    <p class="sub">流程：建立競賽 → 學生按地圖上的「🏔 課堂競賽」選組別加入 → 老師按「開始比賽」→ 全班同時作答，看板即時顯示四座山的登山進度。<br>
    一次只能有一場競賽；建立新的一場會取代舊的。題目用「會考挑戰」的題庫，全班題目與順序相同。</p></div>`;
  const fill = ()=>{ const m=+document.getElementById('cmod').value; CTT.mod=m; const st=examStage(m);
    document.getElementById('cscope').innerHTML = `<option value="all">全部（${EXAM.filter(e=>st.parts.includes(e.grp)).length} 題）</option>` + st.parts.map(k=>`<option value="${k}">${EXAM_GRP[k]}（${EXAM.filter(e=>e.grp===k).length} 題）</option>`).join(''); };
  fill(); document.getElementById('cmod').onchange = fill;
  document.getElementById('bk').onclick = ()=>{ ctStop(); teacher(); };
  const msg = t=>{ document.getElementById('cmsg').innerHTML = t; };
  document.getElementById('cnew').onclick = ()=>{
    CTT.pin = document.getElementById('cpin').value;
    const q = `cset&op=create&pin=${encodeURIComponent(CTT.pin)}&mod=${CTT.mod}&scope=${document.getElementById('cscope').value}&cls=${encodeURIComponent(document.getElementById('ccls').value)}&mins=${+document.getElementById('cmins').value||10}`;
    msg('建立中…');
    ctGet(q).then(d=>{ if(d.error) return msg('⚠ '+d.error); CTT.c = d.contest; contestBoard(); }).catch(e=>msg('⚠ 連線失敗：'+e));
  };
  document.getElementById('copen').onclick = ()=>{
    CTT.pin = document.getElementById('cpin').value;
    ctGet('contest').then(d=>{ if(!d.contest) return msg('目前沒有競賽，請先建立。'); CTT.c=d.contest; contestBoard(); }).catch(e=>msg('⚠ 連線失敗：'+e));
  };
}
function ctSet(op, extra=''){
  return ctGet(`cset&op=${op}&pin=${encodeURIComponent(CTT.pin)}${extra}`).then(d=>{ if(d.error){ alertBox(d.error); return; } CTT.c=d.contest; renderBoard(); });
}
function alertBox(t){ const m=document.getElementById('bmsg'); if(m) m.textContent='⚠ '+t; }
function contestBoard(){
  ctStop();
  app.innerHTML = `<div class="board" id="board">
    <div class="bhead"><div><b id="btitle"></b><div class="sub" id="bsub"></div></div>
      <div class="bclock" id="bclock"></div>
      <div class="bctl"><button class="btn red" id="bstart">開始比賽</button><button class="btn" id="bend">結束比賽</button>
      <button class="btn ghost small" id="bfull">全螢幕</button><button class="btn ghost small" id="bback">返回</button></div></div>
    <div id="bmsg" class="sub"></div>
    <div class="quad" id="quad">${GROUPS.map(g=>`<div class="qd" id="qd${g}"></div>`).join('')}</div></div>`;
  document.getElementById('bstart').onclick = ()=>ctSet('start');
  document.getElementById('bend').onclick = ()=>ctSet('end');
  document.getElementById('bfull').onclick = ()=>{ const el=document.getElementById('board'); try{ (document.fullscreenElement?document.exitFullscreen():el.requestFullscreen()).catch(()=>{}); }catch(e){} };
  document.getElementById('bback').onclick = ()=>{ ctStop(); contestTeacher(); };
  renderBoard();
  const tick = ()=> ctGet('contest').then(d=>{ CTT.c = d.contest; renderBoard(); }).catch(()=>{});
  CT.poll = setInterval(tick, 2000); if(CT.clock) clearInterval(CT.clock); CT.clock = setInterval(()=>{ if(document.getElementById('bclock')) renderClock(); }, 1000);
}
function renderClock(){
  const c = CTT.c, el = document.getElementById('bclock'); if(!el || !c) return;
  if(c.status==='waiting'){ el.textContent = '等待開始'; el.className='bclock'; return; }
  if(c.status==='ended'){ el.textContent = '比賽結束'; el.className='bclock end'; return; }
  const left = Math.round(c.mins*60 - (ctNow()-c.startAt)/1000);
  el.textContent = left>=0 ? `⏳ ${fmtClock(left)}` : '⏰ 時間到'; el.className = 'bclock'+(left<=60?' late':'');
  if(left < -5 && c.status==='running' && !CTT.autoEnding){ CTT.autoEnding = true; ctSet('end').finally(()=>{ CTT.autoEnding=false; }); }
}
function renderBoard(){
  const c = CTT.c; if(!document.getElementById('quad')) return;
  if(!c){ document.getElementById('btitle').textContent='目前沒有競賽'; return; }
  const total = ctQuestions(c).length;
  const n = Object.keys(c.players||{}).length;
  document.getElementById('btitle').textContent = `🏔 ${ctScopeName(c)}`;
  document.getElementById('bsub').textContent = `${c.cls?c.cls+' 班・':''}${total} 題・限時 ${c.mins} 分鐘・已加入 ${n} 人`;
  document.getElementById('bstart').classList.toggle('hidden', c.status!=='waiting');
  document.getElementById('bend').classList.toggle('hidden', c.status!=='running');
  renderClock();
  GROUPS.forEach(g=>{
    const ps = ctPlayers(c, g); const box = document.getElementById('qd'+g);
    const champ = (c.status==='ended' || groupFinished(c,g)) && ps.length ? ps[0] : null;
    box.innerHTML = `<div class="qdh" style="background:${GROUP_COLOR[g]}">${g} 組 <small>${ps.length} 人</small></div>
      <div class="mtn">${mountainSVG(ps, total, g)}${champ?`<div class="champ"><div class="trophy">🏆</div><div class="cname">${champ.name}</div><div class="csub">${champ.correct}/${total}・${fmtClock(champ.secs)}</div></div>`:''}</div>
      ${ctBoardList(ps, total, '')}`;
  });
}
const TRAIL = [[70,232],[150,210],[80,178],[190,150],[120,118],[215,92],[170,66],[236,36]];
function trailPoint(f){
  const seg = []; let L = 0;
  for(let i=1;i<TRAIL.length;i++){ const d = Math.hypot(TRAIL[i][0]-TRAIL[i-1][0], TRAIL[i][1]-TRAIL[i-1][1]); seg.push(d); L+=d; }
  let t = Math.max(0,Math.min(1,f))*L;
  for(let i=0;i<seg.length;i++){ if(t<=seg[i]){ const a=TRAIL[i], b=TRAIL[i+1], r=t/seg[i]; return [a[0]+(b[0]-a[0])*r, a[1]+(b[1]-a[1])*r]; } t-=seg[i]; }
  return TRAIL[TRAIL.length-1];
}
function mountainSVG(ps, total, g){
  const col = GROUP_COLOR[g];
  const bucket = p => Math.round((total ? p.correct/total : 0)*20);
  const cnt = {}; ps.forEach(p=>{ const k=bucket(p); cnt[k]=(cnt[k]||0)+1; });
  const seen = {};
  const climbers = ps.map((p,i)=>{
    const f = total ? p.correct/total : 0; const k = bucket(p);
    const j = seen[k] = (seen[k]||0); seen[k]++;
    const n = cnt[k], perRow = 5, row = Math.floor(j/perRow), col = j%perRow;
    const inRow = Math.min(perRow, n - row*perRow);
    let [x,y] = trailPoint(f);
    x = x + (col - (inRow-1)/2)*24; y = y - row*24;
    x = Math.max(12, Math.min(388, x)); y = Math.max(14, Math.min(240, y));
    return {x, y, p, below:false, crowd:n>2, top:p.done && p.correct===total};
  });
  return `<svg viewBox="0 0 400 250" class="msvg">
    <defs><linearGradient id="mg${g}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb3a3"/><stop offset="1" stop-color="#5d7a64"/></linearGradient></defs>
    <rect x="0" y="0" width="400" height="250" fill="#eaf3fb"/>
    <polygon points="0,250 90,140 140,170 236,30 320,150 360,120 400,170 400,250" fill="url(#mg${g})"/>
    <polygon points="236,30 210,70 222,66 236,78 250,64 262,72" fill="#fff"/>
    <polyline points="${TRAIL.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#f4e3b5" stroke-width="4" stroke-dasharray="6 5" stroke-linecap="round"/>
    <line x1="236" y1="30" x2="236" y2="6" stroke="#333" stroke-width="2"/><polygon points="236,6 258,12 236,18" fill="${col}"/>
    ${[0.25,0.5,0.75].map(f=>{ const [x,y]=trailPoint(f); return `<text x="${x+10}" y="${y+4}" font-size="9" fill="#ffffffcc">${Math.round(f*total)}</text>`; }).join('')}
    ${climbers.map(c=>`<g class="climber" style="transform:translate(${c.x}px,${c.y}px)">
      <circle r="11" fill="${c.top?'#f5c542':col}" stroke="#fff" stroke-width="2"/>
      <text y="3" text-anchor="middle" font-size="8.5" fill="#fff" font-weight="700">${String(c.p.name).length>2?String(c.p.name).slice(-2):String(c.p.name)}</text>
      ${c.top?'<text y="-14" text-anchor="middle" font-size="12">🚩</text>':''}</g>`).join('')}
  </svg>`;
}

flushQueue();
loadBank();
if(student){ loadStudent(); syncMine(); }
home();
</script>
